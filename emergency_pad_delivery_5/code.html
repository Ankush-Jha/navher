<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Period Tracker</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#ff4b72", // Playful pink
          "primary-light": "#ff8fa7",
          "background-light": "#ffffff",
          "background-dark": "#1a1a1a",
          "surface": "#f7f7f7",
          "accent-teal": "#2dd4bf", // Soft teal
          "accent-teal-light": "#ccfbf1",
          "accent-yellow": "#ffc800",
        },
        fontFamily: {
          "display": ["Nunito", "sans-serif"] // Rounded, playful font
        },
        borderRadius: {
          "DEFAULT": "12px", 
          "lg": "16px", 
          "xl": "24px", 
          "2xl": "32px",
          "full": "9999px"
        },
        boxShadow: {
          "button": "0 4px 0 0 rgba(0,0,0,0.1)",
          "button-active": "0 0 0 0 rgba(0,0,0,0.1)",
          "card": "0 2px 8px rgba(0,0,0,0.05)",
        }
      },
    },
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
  body {
    font-family: 'Nunito', sans-serif;
  }
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 24;
  }
  .material-symbols-outlined.fill {
    font-variation-settings: 'FILL' 1;
  }
  .notion-card {
    border: 2px solid #e5e7eb;
    border-radius: 16px;
    background: white;
    transition: all 0.2s ease;
  }
  .notion-card:hover {
    border-color: #ff4b72;
    background: #fff0f3;
  }
  .duo-btn {
    box-shadow: 0 4px 0 0 var(--btn-shadow-color, #d33c5e);
    transform: translateY(0);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .duo-btn:active {
    box-shadow: 0 0 0 0 var(--btn-shadow-color, #d33c5e);
    transform: translateY(4px);
  }
</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-100 flex justify-center items-start min-h-screen">
<div class="relative w-full max-w-[400px] min-h-[850px] h-screen sm:h-auto sm:my-8 bg-background-light dark:bg-background-dark sm:rounded-[40px] sm:border-[12px] border-slate-900 shadow-2xl overflow-hidden flex flex-col font-display">
<div class="h-12 w-full flex items-center justify-between px-6 pt-2 z-50 bg-background-light dark:bg-background-dark">

</div>
</div>
<div class="px-5 pt-2 pb-4 bg-background-light dark:bg-background-dark z-10 sticky top-12 flex flex-col gap-3">
<div class="flex items-center gap-3">
<button class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-100 transition-colors text-slate-400">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1 h-3.5 bg-slate-100 rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full w-4/5 bg-accent-teal rounded-full relative">

</div>
</div>
<div class="size-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0">

</h2>

<div class="notion-card p-4 flex items-center justify-between shadow-sm relative overflow-hidden cursor-pointer group">

</div>

<p class="font-extrabold text-slate-800 text-lg group-hover:text-primary transition-colors">Cravings</p>

</div>
</div>
<span class="material-symbols-outlined text-slate-300 group-hover:text-primary transition-colors">chevron_right</span>
</div>
</div>
</div>
<div class="absolute bottom-0 left-0 w-full px-6 pb-8 pt-4 bg-white z-20 border-t-2 border-slate-100">
<button class="duo-btn w-full bg-primary text-white font-extrabold text-lg py-4 rounded-2xl flex items-center justify-center gap-2" style="--btn-shadow-color: #d33c5e">
<span class="material-symbols-outlined fill text-[24px]">add_circle</span>
      LOG SYMPTOMS
    </button>
</div>
<div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-900 rounded-full z-40"></div>
